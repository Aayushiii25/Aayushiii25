<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="300" height="250">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .border { stroke: #1b4d1b; stroke-width: 1.5; fill: none; }
      .glow-border { stroke: #39ff14; stroke-width: 1.5; fill: none; filter: url(#glow); opacity: 0.4; }
      .header-line { stroke: #1b4d1b; stroke-width: 1; }
      .header-text { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-size: 11px; fill: #39ff14; opacity: 0.7; }
      
      .terminal-prompt { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-weight: bold; font-size: 12px; fill: #39ff14; }
      .terminal-command { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-size: 12px; fill: #ffffff; }
      
      .stat-label { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-size: 12px; fill: #8b949e; }
      .stat-val { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-weight: bold; font-size: 12px; fill: #ffffff; }
      .stat-highlight { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-weight: bold; font-size: 12px; fill: #39ff14; filter: url(#glow-soft); }
      
      .bar-bg { fill: #161b22; rx: 3px; ry: 3px; }
      .bar-easy { fill: #39ff14; rx: 3px; ry: 3px; filter: url(#glow-easy); }
      .bar-medium { fill: #ffb703; rx: 3px; ry: 3px; filter: url(#glow-medium); }
      .bar-hard { fill: #ff006e; rx: 3px; ry: 3px; filter: url(#glow-hard); }
      
      .footer-text { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; font-size: 10px; fill: #8b949e; opacity: 0.5; }
      
      /* Hover interactions */
      .interactive-panel { transition: all 0.3s ease; }
      .interactive-panel:hover { filter: drop-shadow(0 0 8px #39ff14); }
    </style>
    
    <!-- Neon Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-easy" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-medium" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-hard" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background and Border -->
  <g class="interactive-panel">
    <rect class="bg" width="298" height="248" x="1" y="1" rx="8" ry="8" />
    <rect class="glow-border" width="298" height="248" x="1" y="1" rx="8" ry="8" />
    <rect class="border" width="298" height="248" x="1" y="1" rx="8" ry="8" />
  </g>

  <!-- Terminal Header -->
  <g>
    <!-- Window Controls (Red, Yellow, Green) -->
    <circle cx="20" cy="16" r="4.5" fill="#ff5f56" />
    <circle cx="34" cy="16" r="4.5" fill="#ffbd2e" />
    <circle cx="48" cy="16" r="4.5" fill="#27c93f" />
    
    <!-- Title -->
    <text x="150" y="20" text-anchor="middle" class="header-text">guest@cp-dashboard:~</text>
    <line x1="1" y1="32" x2="299" y2="32" class="header-line" />
  </g>

  <!-- Left Column: LeetCode -->
  <a href="https://leetcode.com/u/aayushidhurandhar" target="_blank">
    <g transform="translate(25, 50)">
      <!-- Command Line Prompt -->
      <text x="0" y="12" class="terminal-prompt">$ <tspan class="terminal-command">cat leetcode.json</tspan></text>
      <line x1="0" y1="20" x2="250" y2="20" class="header-line" opacity="0.3" />
      
      <!-- Stats -->
      <text x="0" y="40" class="stat-label">Solved Total:</text>
      <text x="250" y="40" text-anchor="end" class="stat-highlight">511 / 3991</text>
      
      <!-- Easy -->
      <text x="0" y="65" class="stat-label">Easy:</text>
      <text x="250" y="65" text-anchor="end" class="stat-val">141 / 954</text>
      <rect x="0" y="72" width="250" height="6" class="bar-bg" />
      <rect x="0" y="72" width="37" height="6" class="bar-easy" />

      <!-- Medium -->
      <text x="0" y="105" class="stat-label">Medium:</text>
      <text x="250" y="105" text-anchor="end" class="stat-val">303 / 2084</text>
      <rect x="0" y="112" width="250" height="6" class="bar-bg" />
      <rect x="0" y="112" width="36" height="6" class="bar-medium" />

      <!-- Hard -->
      <text x="0" y="145" class="stat-label">Hard:</text>
      <text x="250" y="145" text-anchor="end" class="stat-val">67 / 953</text>
      <rect x="0" y="152" width="250" height="6" class="bar-bg" />
      <rect x="0" y="152" width="18" height="6" class="bar-hard" />
    </g>
  </a>

  <!-- Vertical Divider & Codeforces Column -->
  <g display="none">
    <!-- Vertical Divider -->
    <line x1="300" y1="42" x2="300" y2="215" class="header-line" opacity="0.3" />

    <!-- Right Column: Codeforces -->
    <a href="https://codeforces.com/profile/aayushiiii25" target="_blank">
      <g transform="translate(325, 50)">
        <!-- Command Line Prompt -->
        <text x="0" y="12" class="terminal-prompt">$ <tspan class="terminal-command">neofetch --codeforces</tspan></text>
        <line x1="0" y1="20" x2="250" y2="20" class="header-line" opacity="0.3" />
        
        <!-- Handle -->
        <text x="0" y="42" class="stat-label">Handle:</text>
        <text x="250" y="42" text-anchor="end" class="stat-val">aayushiiii25</text>
        
        <!-- Solved Count -->
        <text x="0" y="72" class="stat-label">Solved Total:</text>
        <text x="250" y="72" text-anchor="end" class="stat-highlight">17</text>
        
        <!-- Current Rating / Rank -->
        <text x="0" y="102" class="stat-label">Current Rating:</text>
        <text x="250" y="102" text-anchor="end" class="stat-val">0 (Unrated)</text>
        
        <!-- Max Rating / Rank -->
        <text x="0" y="132" class="stat-label">Max Rating:</text>
        <text x="250" y="132" text-anchor="end" class="stat-val">0 (Unrated)</text>
        
        <!-- Status Log -->
        <text x="0" y="162" class="stat-label">System State:</text>
        <text x="250" y="162" text-anchor="end" class="stat-val" fill="#39ff14" filter="url(#glow-soft)" opacity="0.95">ACTIVE</text>
      </g>
    </a>
  </g>

  <!-- Footer Line -->
  <line x1="1" y1="225" x2="299" y2="225" class="header-line" />
  
  <!-- Footer Refreshed Status -->
  <text x="15" y="239" class="footer-text">[SYSTEM STATUS: ONLINE]</text>
  <text x="285" y="239" text-anchor="end" class="footer-text">REFRESHED: 2026-07-18 01:19 UTC</text>
</svg>