name: Update CP Widgets

on:
  schedule:
    # Runs every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows manual triggering of the workflow

permissions:
  contents: write

jobs:
  update-widgets:
    runs-on: ubuntu-latest

    env:
      LEETCODE_USERNAME: "aayushiii"
      CODEFORCES_HANDLE: "aayushiiii25"
      THEME: "matrix-green" # Options: matrix-green, cyber-purple, github-dark

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch latest LeetCode and Codeforces statistics
        run: |
          python scripts/fetch_leetcode.py --username "${{ env.LEETCODE_USERNAME }}"
          python scripts/fetch_codeforces.py --handle "${{ env.CODEFORCES_HANDLE }}"

      - name: Generate SVG widgets
        run: |
          python scripts/build_dashboard.py --theme "${{ env.THEME }}"
          python scripts/build_leetcode.py --theme "${{ env.THEME }}"
          python scripts/build_codeforces.py --theme "${{ env.THEME }}"

      - name: Commit and push if files changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ widgets/
          # Commit only if there are changes to commit
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update stats and svg widgets [skip ci]" && git push)
